<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;500&family=Great+Vibes&family=Jost:wght@300;400&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:
      radial-gradient(70% 46% at 50% 34%, rgba(210,164,71,.2) 0%, transparent 62%),
      linear-gradient(180deg, #08242C 0%, #0E3A44 46%, #0F5E6B 72%, #C2A052 130%);
    position: relative;
    display:flex; align-items:center; justify-content:center;
  }
  .dome { position:absolute; left:50%; top:20px; transform:translateX(-50%); width:600px; opacity:.72; }
  .arch { position:absolute; left:50%; top:50%; transform:translate(-50%,-49%); width:430px; opacity:.96; }
  .inner { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:340px; padding:26px 20px; text-align:center;
    background: radial-gradient(closest-side, rgba(8,36,44,.52) 0%, rgba(8,36,44,.28) 62%, transparent 100%); }
  .bismillah { font-family:'Amiri',serif; color:rgba(216,180,110,.95); font-size:26px; margin-bottom:8px; }
  .eyebrow { font-family:'Jost',sans-serif; font-weight:300; color:rgba(245,239,227,.62); font-size:14px; letter-spacing:.3em; text-indent:.3em; text-transform:uppercase; }
  .names { font-family:'Great Vibes',cursive; font-size:88px; line-height:1.04; color:#F3E3B4; text-shadow:0 3px 30px rgba(210,164,71,.45); margin-top:6px; }
  .date { font-family:'Cinzel',serif; color:#D2A447; font-size:25px; letter-spacing:.2em; margin-top:10px; }
  .venue { font-family:'Cormorant Garamond',serif; color:rgba(245,239,227,.6); font-size:18px; letter-spacing:.12em; margin-top:8px; }
  .lantern-l, .lantern-r { position:absolute; top:-24px; width:170px; height:auto; }
  .lantern-l { left:96px; }
  .lantern-r { right:96px; transform:scaleX(-1); }
  .crescent { position:absolute; top:30px; left:50%; transform:translateX(-50%); width:56px; }
  .roses-bl, .roses-br { position:absolute; bottom:-20px; width:250px; height:auto; }
  .roses-bl { left:-24px; transform:rotate(-4deg); }
  .roses-br { right:-24px; transform:scaleX(-1) rotate(-4deg); }
</style>
</head>
<body>
<img class="dome" src="assets/art/dome-bukhara.webp" alt="">
<img class="arch" src="assets/art/arch-bukhara-tall.png" alt="">
<img class="crescent" src="assets/art/crescent-bukhara.webp" alt="">
<img class="lantern-l" src="assets/art/lantern-bukhara.png" alt="">
<img class="lantern-r" src="assets/art/lantern-bukhara.png" alt="">
<div class="inner">
  <p class="bismillah">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</p>
  <p class="eyebrow">With the blessings of our families</p>
  <p class="names">Yasmin &amp; Tariq</p>
  <p class="date">09 · 04 · 2027</p>
  <p class="venue">The Firuza Mahal · Karachi</p>
</div>
<img class="roses-bl" src="assets/art/roses-bukhara.png" alt="">
<img class="roses-br" src="assets/art/roses-bukhara.png" alt="">
</body>
</html>
